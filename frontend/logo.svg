<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <!--
    Metafile mark: a cursive "f" tilted 90 degrees (flowing left to right,
    entry curl, arch and descending tail) paired with a straight pole set on
    its tail — together the three legs read as an "m".
  -->
  <g fill="none" stroke="#1D1D1F" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- tilted cursive f: entry curl, arch, tail sweeping toward the pole -->
    <path d="M 11 37 C 16 28, 26 26, 32 32 C 38 38, 39.5 51, 37.5 62 C 36.3 69, 33.5 75.5, 28.5 80"/>
    <!-- second arch carried from the f's shoulder -->
    <path d="M 32 32 C 39 23, 53 23, 59 31 C 64.5 38.5, 64.8 52, 61.5 63 C 60 69.5, 57.2 75.8, 53 80"/>
    <!-- the pole on the f's tail -->
    <line x1="72.5" y1="27" x2="72.5" y2="80"/>
  </g>
</svg>
